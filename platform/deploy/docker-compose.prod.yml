# EXEMPLE NON TESTÉ — à adapter (hébergeur UE, HTTPS devant le service, sauvegardes).
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://gestion:${DB_PASSWORD}@db:5432/gestion
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${APP_URL} # ex. https://app.isoplan.fr (le service)
      SITE_URL: ${SITE_URL} # ex. https://www.isoplan.fr (le site vitrine, même conteneur)
      CRON_SECRET: ${CRON_SECRET}
      APP_ORIGIN: ${APP_HOST}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # + STRIPE_PRICE_<OFFRE>_<MONTH|YEAR> (voir .env.example)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
    depends_on: [db]
    ports: ["127.0.0.1:3000:3000"] # exposé uniquement au proxy HTTPS local
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gestion
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gestion
    volumes: [db-data:/var/lib/postgresql/data]
volumes:
  db-data:
